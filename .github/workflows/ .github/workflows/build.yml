name: Build ShortBlock APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ShortBlock-Project-Download.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -o ShortBlock-Project-Download.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd project
          if [ ! -f settings.gradle.kts ] && [ -f Settings.gradle.kts ]; then
            mv Settings.gradle.kts settings.gradle.kts
          fi
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShortBlock-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
